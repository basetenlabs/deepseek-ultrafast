[package]
name = "deepseek-ultrafast-kv-transfer"
edition.workspace = true
version.workspace = true

[features]
default = ["rdma"]
rdma = ["velo/ucx"]

[dependencies]
anyhow.workspace = true
deepseek-ultrafast-logging = { path = "../logging" }
redis = { version = "1.8", default-features = false, features = ["script", "tokio-comp", "connection-manager"] }
bytes = { version = "1", features = ["serde"] }
blake3 = { version = "1.8", features = ["rayon"] }
rayon.workspace = true
futures = "0.3"
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10", features = ["asm"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
velo = { git = "https://github.com/ai-dynamo/velo", rev = "2c754eb0c773984254174d58eb983fa6136d6a07", default-features = false }
