[workspace]
resolver = "3"
members = ["crates/cuda", "crates/kernels", "crates/model", "crates/engine", "crates/server", "crates/kv-transfer", "crates/logging"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "cuda-13000", "dynamic-loading"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
memmap2 = "0.9"
half = "2"
rayon = "1"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }

[profile.release]
debug = 1
codegen-units = 16
